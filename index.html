:color .35s,background .35s}.icon svg{width:21px;height:21px}.label{display:flex;flex-direction:column;gap:7px}.name{font-size:14px;letter-spacing:.4px}.handle{color:#8592a2;font-size:11px;letter-spacing:.3px}.arrow{margin-left:auto;color:#617181;width:18px;height:18px;transition:transform .35s,color .35s}.social:focus-visible{outline:2px solid var(--accent);outline-offset:5px}.social:active{transform:scale(.978);transition:transform .12s}.ripple{position:absolute;border-radius:50%;width:20px;height:20px;background:#b4eaff25;pointer-events:none;animation:ripple .7s ease-out forwards}.footer{display:flex;justify-content:space-between;align-items:center;gap:20px;border-top:1px solid #b3cce50d;padding-top:20px;color:#536171;font-size:9px;letter-spacing:1.5px}.footer span:last-child{letter-spacing:2px}.connection{display:flex;align-items:center;justify-content:center;gap:8px;margin:29px 0 0;color:#667787;font-size:10px;letter-spacing:.8px}.connection span{width:3px;height:3px;background:#7f9ba9;border-radius:50%}@property --angle{syntax:'<angle>';initial-value:0deg;inherits:false}@keyframes orbit{to{--angle:360deg}}@keyframes aurora{to{transform:translate(12%,18%) scale(1.15)}}@keyframes reveal{from{opacity:0;transform:translateY(19px);filter:blur(5px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}@keyframes ripple{to{transform:scale(35);opacity:0}}@media(hover:hover) and (pointer:fine){.social:hover{transform:translateY(-3px);border-color:#a8dfff36;background:#9ccfff07;box-shadow:0 12px 28px #0003}.social:hover:before{opacity:1}.social:hover .icon{color:#d4f0ff;background:#a1dbff0c}.social:hover .arrow{transform:translateX(4px);color:#c4e8f8}.social:active{transform:scale(.978)}}@media(min-width:1500px){main{max-width:470px}h1{font-size:52px}}@media(max-width:600px){.page{padding:25px 23px 23px}.topbar{font-size:8px;letter-spacing:1.6px}.wordmark{font-size:10px;letter-spacing:3px}main{padding:52px 0 47px;max-width:400px}.avatar-wrap{width:118px;height:118px;margin-bottom:29px}h1{font-size:40px;letter-spacing:7px}.social{min-height:81px;padding:17px 18px}.footer{font-size:8px;letter-spacing:1px}.ambient:before{width:150vw;height:150vw;top:-40%;left:-50%}.ambient:after{width:140vw;height:140vw;left:40%;top:45%}.spotlight{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.ripple{display:none}}
</style>

<script>
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');
document.getElementById('year').textContent=new Date().getFullYear();
if(matchMedia('(hover: hover) and (pointer: fine)').matches){
let frame=0;
document.addEventListener('pointermove',e=>{if(reduceMotion.matches)return;cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{document.documentElement.style.setProperty('--x',e.clientX+'px');document.documentElement.style.setProperty('--y',e.clientY+'px')})});
document.querySelectorAll('.social').forEach(link=>link.addEventListener('pointermove',e=>{const r=link.getBoundingClientRect();link.style.setProperty('--lx',e.clientX-r.left+'px');link.style.setProperty('--ly',e.clientY-r.top+'px')}));
}
document.querySelectorAll('.social').forEach(link=>link.addEventListener('pointerdown',e=>{if(reduceMotion.matches)return;const r=link.getBoundingClientRect(),dot=document.createElement('span');dot.className='ripple';dot.style.left=e.clientX-r.left-10+'px';dot.style.top=e.clientY-r.top-10+'px';link.append(dot);dot.addEventListener('animationend',()=>dot.remove(),{once:true})}));
</script>
